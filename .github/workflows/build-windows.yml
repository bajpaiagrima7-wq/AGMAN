name: Build AGMAN Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get AGMAN code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build AGMAN EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name AGMAN main.py

      - name: Upload AGMAN Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AGMAN-Windows
          path: dist/AGMAN/
